<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alzheimer's Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container form-container">
        <a href="index.html" style="text-decoration: none; color: #555;">&larr; Back to Portal</a>
        
        <h1>Alzheimer's Disorder Prediction</h1>
        
        <form id="prediction-form">
            <div class="form-grid">
                
                <div class="form-group">
                    <label for="m_f">Sex (M/F)</label>
                    <select id="m_f" name="M/F" required>
                        <option value="">-- Please select --</option>
                        <option value="0">Male</option>
                        <option value="1">Female</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" step="1" id="age" name="Age" required>
                </div>

                <div class="form-group">
                    <label for="educ">Education (Years)</label>
                    <input type="number" step="1" id="educ" name="EDUC" required>
                </div>
                
                <div class="form-group">
                    <label for="ses">Socioeconomic Status (SES)</label>
                    <input type="number" step="any" id="ses" name="SES">
                    <small>Leave blank if unknown (will be filled)</small>
                </div>

                <div class="form-group">
                    <label for="mmse">MMSE Score</label>
                    <input type="number" step="any" id="mmse" name="MMSE">
                </div>

                <div class="form-group">
                    <label for="etiv">Est. Intracranial Volume (eTIV)</label>
                    <input type="number" step="1" id="etiv" name="eTIV" required>
                </div>

                <div class="form-group">
                    <label for="nwbv">Norm. Whole Brain Volume (nWBV)</label>
                    <input type="number" step="any" id="nwbv" name="nWBV" required>
                </div>

                <div class="form-group">
                    <label for="asf">Atlas Scaling Factor (ASF)</label>
                    <input type="number" step="any" id="asf" name="ASF" required>
                </div>

                <button type="submit" class="btn-submit">Predict</button>

                <div id="result-container" role="alert" style="display: none;">
                    <p id="result-text"></p>
                </div>

            </div>
        </form>
    </div>
    
    <script src="alzheimers.js" defer></script>
</body>
</html>
